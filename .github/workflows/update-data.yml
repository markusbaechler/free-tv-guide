name: Daten aktualisieren

on:
  schedule:
    - cron: '17 */6 * * *' # alle 6 h (UTC), Minute 17 statt :00 wegen Auslastung
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['config/**', 'pipeline/**', 'package-lock.json', '.github/workflows/update-data.yml']

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bisherige Daten als Cache übernehmen
        run: |
          mkdir -p out
          if git fetch --depth 1 origin data:refs/remotes/origin/data 2>/dev/null; then
            git archive origin/data | tar -x -C out
          else
            echo "Noch kein Branch «data» – Erstlauf ohne Cache."
          fi

      - name: Pipeline
        env:
          SRG_CLIENT_ID: ${{ secrets.SRG_CLIENT_ID }}
          SRG_CLIENT_SECRET: ${{ secrets.SRG_CLIENT_SECRET }}
          OUT_DIR: ${{ github.workspace }}/out
        run: npm run pipeline

      - name: Im Branch «data» veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          rm -rf .git
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Daten $(date -u +%Y-%m-%dT%H:%MZ)"
          # Immer nur ein Commit: der Branch enthält den aktuellen Stand, keine Historie
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data

      - name: Status prüfen
        run: |
          status=$(node -e "console.log(require('./out/meta.json').srg.status)")
          echo "SRG-Status: $status"
          node -e "const m=require('./out/meta.json'); console.log(JSON.stringify(m.counts))"
          case "$status" in
            auth-error) echo "::error::SRG-Zugangsdaten abgelehnt – Secrets prüfen."; exit 1 ;;
            error)      echo "::error::SRG-API nicht erreichbar – Cache verwendet."; exit 1 ;;
            missing-credentials) echo "::warning::Secrets SRG_CLIENT_ID/SRG_CLIENT_SECRET fehlen." ;;
          esac
