name: SRG-Diagnose (temporär)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - env:
          SRG_CLIENT_ID: ${{ secrets.SRG_CLIENT_ID }}
          SRG_CLIENT_SECRET: ${{ secrets.SRG_CLIENT_SECRET }}
        run: node pipeline/probe-srg.ts
