# Senderliste für den Tab «Sender».
# epg:      "srg:<bu>:<station>" = Programmdaten aus der SRG SSR EPG API, null = keine EPG-Quelle (Sat-Sender: Programm aus dem Sat-Signal)
# sources:  Empfangswege in Prioritätsreihenfolge – die App nimmt den ersten, der funktioniert (Entscheid 31.10.2026):
#           1. Direktstream in der App, 2. Sat-Tuner des Fernsehers, 3. externe App
#           srg    = in der App über die SRG-API (Livestream-URN, Pillarbox; nur SRF/RTS/RSI)
#           direct = in der App über den offiziellen, frei zugänglichen Livestream des Senders (ohne DRM, ohne Login,
#                    ohne Geoblocking für CH), Adresse wie auf der Website des Senders. Felder: url (Manifest), type (hls|dash),
#                    source (Live-Seite des Senders), checked (Datum der Prüfung aus CH)
#           sat    = Sat-/DVB-Tuner des Fernsehers (Astra 19.2°E u. a.). names = Sendernamen in der Tuner-Liste, bevorzugte zuerst (HD vor SD)
#           joyn   = Joyn-App (Joyn Schweiz: gratis, ohne bekanntes Zeitlimit, kurze Werbespots vor dem Stream)
#           zattoo = Zattoo-App (Zattoo Free: Werbung beim Umschalten, 10 h/Monat am TV) – nur wenn es nichts anderes gibt
# deeplink: Startparameter für die externe App (PAYLOAD); Joyn/Zattoo kennen keinen (SPEC.md 4.5a). null = nur App öffnen
# verified: false = Empfang über den ersten Weg noch nicht am TV geprüft
# favorites: Reihenfolge im Abschnitt «Favoriten» (Standardansicht im Tab Sender) und Zapp-Reihenfolge im Player

favorites: [srf1, srf2, srfinfo, daserste, zdf, rtl, sat1, prosieben, vox, rtlzwei, kabeleins, eurosport1, sport1, 3sat, rts1, rts2, rsila1, rsila2, arte, phoenix, zdfneo, zdfinfo, dmax]

channels:
