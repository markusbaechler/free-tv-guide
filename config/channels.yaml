  - { id: srf1,    name: "SRF 1",    country: CH, epg: "srg:srf:srf-1",    sources: [srg, { kind: sat, names: ["SRF 1 HD", "SRF 1"] }], deeplink: null, verified: true }
  - { id: srf2,    name: "SRF zwei", country: CH, epg: "srg:srf:srf-2",    sources: [srg, { kind: sat, names: ["SRF zwei HD", "SRF zwei"] }], deeplink: null, verified: true }
  - { id: srfinfo, name: "SRF info", country: CH, epg: "srg:srf:srf-info", sources: [srg, { kind: sat, names: ["SRF info HD", "SRF info"] }], deeplink: null, verified: true }
  - { id: rts1,    name: "RTS 1",    country: CH, epg: "srg:rts:rts-1",    sources: [srg, { kind: sat, names: ["RTS 1 HD", "RTS Un HD", "RTS 1", "RTS Un"] }], deeplink: null, verified: false }
