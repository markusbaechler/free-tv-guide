  - { id: rsila1,  name: "RSI LA 1", country: CH, epg: "srg:rsi:la-1",     sources: [srg, { kind: sat, names: ["RSI LA 1 HD", "RSI La 1 HD", "RSI LA 1", "RSI La 1"] }], deeplink: null, verified: false }
