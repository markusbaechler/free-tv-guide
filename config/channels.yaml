# Senderliste für den Tab «Sender».
# epg:      "srg:<bu>:<station>" = Programmdaten aus der SRG SSR EPG API, null = keine EPG-Quelle
# app:      wie der Sender abgespielt wird
#           srg    = in der App selbst (offizieller SRG-Livestream über die SRG-API, Pillarbox; nur SRF/RTS/RSI)
#           direct = in der App selbst über den offiziellen, frei zugänglichen Livestream des Senders (ohne DRM, ohne Login,
#                    ohne Geoblocking für CH), Adresse wie auf der Website des Senders. Pflichtfelder in stream:
#                    url (Manifest), type (hls|dash), source (Live-Seite des Senders), checked (Datum der Prüfung aus CH)
#           joyn   = Joyn-App (Joyn Schweiz: gratis, ohne bekanntes Zeitlimit, kurze Werbespots vor dem Stream)
#           zattoo = Zattoo-App (Zattoo Free: Werbung beim Umschalten, 10 h/Monat am TV) – nur wenn es nichts anderes gibt
# deeplink: Startparameter für die externe App (Joyn/Zattoo), wird als App-Control-Datum «PAYLOAD» übergeben;
#           Format nicht dokumentiert, Varianten am TV ausprobieren (Daten werden ohne Neuinstallation geladen). null = nur App öffnen
# verified: false = Empfang über die gewählte App noch nicht am TV geprüft

channels:
  - { id: srf1,     name: "SRF 1",      country: CH, epg: "srg:srf:srf-1", app: srg, deeplink: null, verified: false }
  - { id: srf2,     name: "SRF zwei",   country: CH, epg: "srg:srf:srf-2", app: srg, deeplink: null, verified: false }
  - { id: srfinfo,  name: "SRF info",   country: CH, epg: "srg:srf:srf-info", app: srg, deeplink: null, verified: false }
