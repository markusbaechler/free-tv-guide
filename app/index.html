<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Free-TV Guide</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app">
    <header class="top">
      <nav class="tabs" id="tabs" data-nav-group="tabs"></nav>
      <div class="status" id="status"></div>
    </header>
    <main class="main" id="main"></main>
    <footer class="keys" id="keys"></footer>
  </div>
  <div class="overlay" id="overlay" hidden></div>
  <div class="player" id="player" hidden></div>
  <!-- Sat-Modus: TV-Bild liegt hinter der (dann transparenten) App, Info-Leiste darüber -->
  <div class="satview" id="satview" hidden><div class="pinfo" id="sat-info" hidden></div></div>
  <script src="app.js"></script>
</body>
</html>
